name: CI

# Runs on every pull request into main, and on every push to main or a feature branch.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main, "feature/**"]

# If you push again while a run is in progress, cancel the older run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # 1. TEST: unit/API tests + the deterministic safety evals.
  #    No API keys needed: tests use in-memory SQLite and a scripted fake LLM.
  # ---------------------------------------------------------------------------
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip # re-uses downloaded packages between runs

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run unit and API tests
        run: python -m pytest -q

      # Safety rules checked in plain code (privacy, PTP, tool allow-list...).
      # --mock-agent-llm uses scripted replies, so no Groq key is required.
      # --deterministic-only skips the LLM judge. Exit code is 1 if any case fails.
      - name: Run deterministic safety evals
        run: python -m evals.run_eval --deterministic-only --mock-agent-llm

  # ---------------------------------------------------------------------------
  # 2. DOCKER: build the image and prove the container actually starts.
  #    Only runs if the tests passed.
  # ---------------------------------------------------------------------------
  docker:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build image (not pushed)
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true # make the image available to the next step
          tags: emi-agent:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test, container starts and /health answers
        run: |
          docker run -d --name emi -p 8000:8000 emi-agent:ci
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8000/health; then
              echo; echo "Container is healthy"; exit 0
            fi
            sleep 2
          done
          echo "Container did not become healthy"; docker logs emi; exit 1

  # ---------------------------------------------------------------------------
  # 3. PUBLISH (the "CD" part): only on a push to main, after test + docker pass.
  #    Pushes the image to GitHub Container Registry using the built-in token.
  # ---------------------------------------------------------------------------
  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [test, docker]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Lower-cases the repo name (GHCR requires it) and creates tags.
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=sha

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha