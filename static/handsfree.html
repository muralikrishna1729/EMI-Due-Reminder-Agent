<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Hands-Free Audio</title>
  <style>
    body { font-family: sans-serif; margin: 20px; }
    #status { margin-top: 10px; color: #555; }
  </style>
</head>
<body>
  <h1>Hands-Free Audio</h1>
  <div id="status">Initializing...</div>

  <script>
    // Global session identifier (set by the server when establishing the call)
    const sessionId = '{{SESSION_ID}}';  // This will be replaced at runtime
    const apiToken = '{{API_TOKEN}}';    // This will be replaced at runtime

    // Initialize audio context and load worklet
    let audioContext;
    let workletNode;

    async function initAudio() {
      audioContext = new (window.AudioContext || window.webkitAudioContext)();
      const worklet = await audioContext.audioWorklet.addModule('/audio_worklet.js');
      workletNode = new worklet.audioWorkletNode('pcm-processor');

      // Connect worklet to destination (speakers)
      workletNode.connect(audioContext.destination);

      // Listen for preroll_start messages from the worklet
      workletNode.port.onmessage = event => {
        const {type, startFrame, endFrame} = event.data;
        if (type === 'preroll_start') {
          // Forward to the control WebSocket
          const ws = new WebSocket(`ws://localhost:8000/ws/control/${sessionId}?token=${apiToken}`);
          ws.send(JSON.stringify({type: 'preroll_start', startFrame, endFrame}));
        }
      };

      // Start the AudioWorkletProcessor
      workletNode.port.postMessage({});
    }

    // Kick off initialization
    initAudio().catch(err => {
      document.getElementById('status').textContent = 'Audio initialization failed: ' + err;
    });
  </script>
</body>
</html>
