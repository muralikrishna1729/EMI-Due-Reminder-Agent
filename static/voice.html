<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>EMI reminder: voice demo</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 640px; margin: 2rem auto; padding: 0 1rem; }
  #talk { font-size: 1.2rem; padding: 1rem 2rem; margin: 1rem 0; }
  #log p { margin: .4rem 0; }
  #status { color: #555; }
</style>
</head>
<body>
<h1>EMI Due Reminder Agent</h1>
<div>
  <input id="account" value="ACC-88392">
  <button id="start">Start call</button>
</div>
<p id="status">Not in a call</p>
<button id="talk" disabled>Hold to talk</button>
<div id="log"></div>

<script>
const $ = (id) => document.getElementById(id);
let sessionId = null, stream = null, recorder = null, chunks = [], busy = false;

const addLine = (who, text) => {
  const p = document.createElement("p");
  p.textContent = `${who}: ${text}`;
  $("log").appendChild(p);
};
const setStatus = (text) => { $("status").textContent = text; };

function speak(text, onDone) {
  const u = new SpeechSynthesisUtterance(text);
  u.lang = "en-IN";
  u.onend = onDone;
  u.onerror = onDone;
  speechSynthesis.cancel();
  speechSynthesis.speak(u);
}

async function post(url, body, headers) {
  const res = await fetch(url, { method: "POST", headers, body });
  if (!res.ok) throw new Error(`Server error ${res.status}`);
  return res.json();
}

async function startCall() {
  try {
    stream = stream || await navigator.mediaDevices.getUserMedia({ audio: true });
  } catch (err) {
    setStatus("Microphone permission is needed.");
    return;
  }
  const res = await fetch("/calls", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ account_id: $("account").value }),
  });
  if (!res.ok) {
    setStatus(res.status === 404 ? "Unknown account" : res.status === 403 ? "Customer asked not to be called" : `Error ${res.status}`);
    return;
  }
  const data = await res.json();
  sessionId = data.session_id;
  $("log").innerHTML = "";
  addLine("Agent", data.reply);
  setStatus("Agent speaking...");
  speak(data.reply, () => { $("talk").disabled = false; setStatus("Your turn: hold the button and talk"); });
}

function startRecording() {
  if (!sessionId || busy || $("talk").disabled) return;
  chunks = [];
  const type = MediaRecorder.isTypeSupported("audio/webm;codecs=opus") ? "audio/webm;codecs=opus" : "";
  recorder = new MediaRecorder(stream, type ? { mimeType: type } : undefined);
  recorder.ondataavailable = (e) => { if (e.data.size) chunks.push(e.data); };
  recorder.onstop = sendRecording;
  recorder.start();
  setStatus("Listening...");
}

function stopRecording() {
  if (recorder && recorder.state === "recording") recorder.stop();
}

async function sendRecording() {
  busy = true;
  $("talk").disabled = true;
  setStatus("Thinking...");
  const blob = new Blob(chunks, { type: recorder.mimeType || "audio/webm" });
  let data;
  try {
    if (blob.size < 1500) {        // too short to be speech: count it as silence
      data = await post(`/calls/${sessionId}/turn`, JSON.stringify({ text: "" }), { "Content-Type": "application/json" });
    } else {
      const form = new FormData();
      form.append("audio", blob, "audio.webm");
      data = await post(`/calls/${sessionId}/voice`, form, {});
    }
  } catch (err) {
    setStatus(String(err));
    busy = false;
    $("talk").disabled = false;
    return;
  }
  addLine("You", data.heard || "(silence)");
  addLine("Agent", data.reply);
  if (data.timings_ms) console.log("timings (ms)", data.timings_ms);
  setStatus("Agent speaking...");
  speak(data.reply, () => {
    busy = false;
    if (data.ended) {
      setStatus(`Call ended: ${data.disposition}`);
      sessionId = null;
    } else {
      $("talk").disabled = false;
      setStatus("Your turn: hold the button and talk");
    }
  });
}

$("start").addEventListener("click", startCall);
$("talk").addEventListener("pointerdown", startRecording);
$("talk").addEventListener("pointerup", stopRecording);
$("talk").addEventListener("pointerleave", stopRecording);
</script>
</body>
</html>
